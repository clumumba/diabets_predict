apiVersion: v1
kind: Service
metadata:
  name: diabetes-predictor-service
  labels:
    app: diabetes-predictor
spec:
  type: NodePort
  selector:
    app: diabetes-predictor
  ports:
    - protocol: TCP
      port: 8000         # The port accessible outside the cluster
      targetPort: 8000 # The port your container is listening on
      nodePort: 30080
