apiVersion: apps/v1
kind: Deployment
metadata:
  name: diabetes-predictor-deployment
  labels:
    app: diabetes-predictor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: diabetes-predictor
  template:
    metadata:
      labels:
        app: diabetes-predictor
    spec:
      containers:
      - name: predictor
        image: clumumba62/diabetes_predictor:latest
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
