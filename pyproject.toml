[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetes-predictor"
version = "0.1.0"
description = "Diabetes prediction training pipeline"
requires-python = ">=3.10"
dependencies = ["pandas", "PyYAML", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

